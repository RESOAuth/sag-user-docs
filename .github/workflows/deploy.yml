name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a release can be published without pushing to this repository.
  workflow_dispatch:

# Enough to publish Pages, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the site shows when each page last changed.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Override both when moving to a custom domain, and add a
          # static/CNAME file holding the hostname.
          SITE_URL: https://sag.resoauth.dev
          SITE_BASE_URL: /

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
